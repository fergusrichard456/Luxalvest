<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luxalvest</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 8%;
        }

        header h2 {
            margin: 0;
        }

        .hero {
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 8%;
            background: white;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #555;
            max-width: 650px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            width: fit-content;
            margin-top: 20px;
            padding: 14px 25px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        footer {
            padding: 30px 8%;
            background: #111827;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h2>Luxalvest</h2>
</header>

<section class="hero">
    <h1>Welcome to Luxalvest</h1>

    <p>
        Connecting quality Indonesian products with global markets.
        Luxalvest is committed to building reliable and long-term
        international business partnerships.
    </p>

    <a class="button" href="mailto:info@luxalvest.com">
        Contact Us
    </a>
</section>

<footer>
    © 2026 Luxalvest. All rights reserved.
</footer>

</body>
</html>
